# Placeholder reference only. Real production secrets are NEVER stored here and
# never in gradle.properties / local.properties. The build reads:
#
#   URL_GUARDIAN_KEYSTORE_PATH       absolute path OUTSIDE the repository
#   URL_GUARDIAN_KEY_ALIAS           key alias inside the keystore
#   URL_GUARDIAN_KEYSTORE_PASSWORD   keystore password   (never commit, never paste into chat)
#   URL_GUARDIAN_KEY_PASSWORD        key password        (never commit, never paste into chat)
#   URL_GUARDIAN_KEYSTORE_TYPE       optional, PKCS12 by default
#
# PowerShell setup is documented in docs/production_signing_setup.md.
KEYSTORE_PATH=<outside-repository-path>
KEY_ALIAS=<alias>
KEYSTORE_PASSWORD=<DO_NOT_STORE_HERE>
KEY_PASSWORD=<DO_NOT_STORE_HERE>
